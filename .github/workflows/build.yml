name: build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Default to read-only; the release job widens its own scope below.
permissions:
  contents: read
  actions: read

# Avoid two in-flight runs fighting over the same release / cache slot.
# For PRs we cancel older runs (latest commit wins); for tags we let the
# current run finish so a release is never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Single source of truth for the toolchain version.  go.mod requires
# Go 1.25 (golang.org/x/sys v0.46.0), so the workflows must match.
env:
  GO_VERSION: '1.25'

jobs:
  # -----------------------------------------------------------------------
  # 1. Cross-compile every supported GOOS/GOARCH on a single Linux runner.
  #    This is fast and deterministic.  Real-OS code paths are exercised
  #    separately by the `native` job below.  Artifacts are reused by the
  #    release job.
  # -----------------------------------------------------------------------
  build:
    name: build (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux,   goarch: amd64, exe: ""      }
          - { goos: linux,   goarch: arm64, exe: ""      }
          - { goos: darwin,  goarch: amd64, exe: ""      }
          - { goos: darwin,  goarch: arm64, exe: ""      }
          - { goos: windows, goarch: amd64, exe: ".exe"  }
          - { goos: windows, goarch: arm64, exe: ".exe"  }
    env:
      GOOS:    ${{ matrix.target.goos }}
      GOARCH:  ${{ matrix.target.goarch }}
      GOEXE:   ${{ matrix.target.exe }}
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # Be explicit so forks / sparse checkouts don't trip the
          # "Dependencies file is not found" warning.
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      # Build per-OS artifacts.  Output names follow the convention used by
      # goreleaser / go-build-template so downstream tooling can rely on them.
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          name="usbi-${GOOS}-${GOARCH}${GOEXE}"
          go build -trimpath -ldflags="-s -w" -o "dist/${name}" ./cmd/usbi
          echo "Built dist/${name} ($(stat -c%s "dist/${name}") bytes)"

      - name: Smoke test (linux/amd64 only)
        if: matrix.target.goos == 'linux' && matrix.target.goarch == 'amd64'
        run: |
          set -euo pipefail
          ./dist/usbi-linux-amd64 -version
          ./dist/usbi-linux-amd64 -json -indent | head -n 40 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: usbi-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: dist/usbi-${{ matrix.target.goos }}-${{ matrix.target.goarch }}*
          if-no-files-found: error
          retention-days: 14

  # -----------------------------------------------------------------------
  # 2. Build & smoke-test on the actual host runner.  Catches regressions
  #    that cross-compilation hides (build tags missing on one platform,
  #    init-time panics, native syscalls, etc.).
  # -----------------------------------------------------------------------
  native:
    name: native (${{ runner.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # `go run` here would also work but `go build` is closer to what
          # users will do, so we exercise the same code path.
          go build -trimpath -ldflags="-s -w" -o dist/usbi ./cmd/usbi

      - name: smoke run
        shell: bash
        run: |
          set -euo pipefail
          ./dist/usbi -version
          (./dist/usbi -json -indent 2>&1 | head -n 20) || true

  # -----------------------------------------------------------------------
  # 3. GitHub Release.  Triggered on tag push (v*) or manual dispatch.
  #    Pulls the cross-compiled artifacts from the "build" job so we
  #    produce a single, consistent release per tag.
  # -----------------------------------------------------------------------
  release:
    name: release
    needs: [build]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by softprops/action-gh-release
      actions: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Show downloaded artifacts
        run: ls -laR release-dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/**
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
