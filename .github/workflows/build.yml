name: Build & Test & Optional Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install dependencies
        run: go mod tidy
      - name: Build
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            go build -v -o dist/usbi-windows.exe ./...
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            go build -v -o dist/usbi-linux ./...
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            go build -v -o dist/usbi-macos ./...
          fi
      - name: Test
        run: go test -v ./...

      # Windows 链接验证
      - name: Verify Windows linking
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          dumpbin /IMPORTS dist\usbi-windows.exe | Select-String "SETUPAPI.dll"
          dumpbin /IMPORTS dist\usbi-windows.exe | Select-String "WINUSB.dll"

      # 上传构建产物（仅在发布场景）
      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: usbi-${{ matrix.os }}
          path: dist/*

  release:
    needs: build-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
